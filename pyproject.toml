[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanolaama"
version = "0.1.0"
description = "Talk to an AI on your own computer. No code, no terminal, no accounts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Agarwal" }]
keywords = ["local-llm", "no-code", "ollama", "llama.cpp", "gui", "offline-ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
nanolaama = "nanolaama.__main__:main"

[project.urls]
Homepage = "https://github.com/Agarwalrishu13/nanolaama"

[tool.setuptools]
packages = ["nanolaama"]
include-package-data = true

[tool.setuptools.package-data]
nanolaama = ["web/*"]
